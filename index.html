<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO引擎平台 - 文档中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 48px 40px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .header p {
            opacity: 0.9;
            font-size: 15px;
        }
        .content {
            padding: 32px 40px;
        }
        .doc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .doc-card {
            display: flex;
            align-items: flex-start;
            padding: 24px;
            background: #f8f9fa;
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .doc-card:hover {
            background: white;
            border-color: #e5e7eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .doc-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 20px;
            flex-shrink: 0;
        }
        .doc-info h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #111827;
        }
        .doc-info p {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }
        .footer {
            padding: 20px 40px;
            background: #f8f9fa;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
        }
        @media (max-width: 640px) {
            .doc-grid { grid-template-columns: 1fr; }
            .content { padding: 24px 20px; }
            .header { padding: 32px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GEO 引擎平台</h1>
            <p>产品架构与设计系统文档</p>
        </div>
        <div class="content">
            <div class="doc-grid">
                <a href="GEO_ENGINE_ARCHITECTURE.md" class="doc-card" target="_blank">
                    <div class="doc-icon">📋</div>
                    <div class="doc-info">
                        <h3>功能架构文档</h3>
                        <p>包含功能架构、技术架构、数据模型、API规范、部署方案</p>
                    </div>
                </a>
                <a href="DESIGN_SYSTEM.md" class="doc-card" target="_blank">
                    <div class="doc-icon">🎨</div>
                    <div class="doc-info">
                        <h3>设计规范文档</h3>
                        <p>色彩体系、字体系统、间距规范、组件设计</p>
                    </div>
                </a>
                <a href="design-system.html" class="doc-card" target="_blank">
                    <div class="doc-icon">✨</div>
                    <div class="doc-info">
                        <h3>组件规范展示</h3>
                        <p>交互式设计系统，查看所有组件的视觉样式和状态</p>
                    </div>
                </a>
                <a href="https://fonts.google.com" class="doc-card" target="_blank">
                    <div class="doc-icon">🔤</div>
                    <div class="doc-info">
                        <h3>Inter 字体</h3>
                        <p>Google Fonts 官方站点，可预览 Inter 字体样式</p>
                    </div>
                </a>
            </div>
        </div>
        <div class="footer">
            GEO引擎平台文档中心 · 设计对标 Apple / Google / Anthropic
        </div>
    </div>
</body>
</html>
